[package]
name = "tauri-plugin-navigation"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-navigation"

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_24"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
