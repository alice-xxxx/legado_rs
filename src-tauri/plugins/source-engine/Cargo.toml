[package]
name = "tauri-plugin-source-engine"
version = "0.1.0"
authors = ["Legado Contributors"]
description = "Rust bridge to the Kotlin Multiplatform book source engine"
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-source-engine"

[features]
# Kotlin/Native bootstraps mobile Rust archives without enabling the desktop app feature.
native-mobile = ["tauri/wry"]

[dependencies]
tauri = { version = "2", default-features = false }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
