[package]
name = "legado"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "legado_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 正常 Tauri 应用保留默认桌面运行时；Rust 解析链路测试可关闭此 feature，避免把 WebView/UI
# 原生依赖链接进测试进程，从而让本地 HTTP fixture 能在无窗口环境中直接运行。
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "tauri/wry",
    "tauri/compression",
    "tauri/common-controls-v6",
    "tauri/dynamic-acl",
    "tauri/x11",
    "tauri/dbus",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [], optional = true }
tauri-plugin-opener = { version = "2", default-features = false, optional = true }
tauri-plugin-source-engine = { path = "plugins/source-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
reqwest = { version = "0.13", features = ["cookies", "multipart", "socks"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
jni = { version = "0.22.4", features = ["invocation"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
