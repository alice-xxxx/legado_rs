name: Package Foliver

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        default: all
        options: [all, desktop, android, ios]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    if: inputs.platform == 'all' || inputs.platform == 'desktop'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage,deb
            installers: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            bundles: dmg
            installers: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis
            installers: src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v7
      - name: Read toolchain versions
        run: node src-tauri/toolchain.mjs --github-env
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # 全平台并行时，Linux/macOS 缓存分别由 Android/iOS 写入，避免重复抢占同一个键。
          cache-read-only: ${{ inputs.platform == 'all' && runner.os != 'Windows' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: npm ci
      - run: npm run icons
      - name: Prepare desktop engine and compact Java runtime
        if: runner.os != 'Windows'
        working-directory: src-tauri/plugins/source-engine/engine
        run: bash ./gradlew --no-daemon --console=plain prepareDesktopJvmRuntime
      - name: Prepare desktop engine and compact Java runtime
        if: runner.os == 'Windows'
        working-directory: src-tauri/plugins/source-engine/engine
        env:
          CMAKE_GENERATOR: Ninja
          CC: gcc
          CXX: g++
        run: .\gradlew.bat --no-daemon --console=plain prepareDesktopJvmRuntime
      - name: Configure Linux runtime library search
        if: runner.os == 'Linux'
        run: echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/src-tauri/plugins/source-engine/engine/build/source-engine/runtime/jre/lib/server:$GITHUB_WORKSPACE/src-tauri/plugins/source-engine/engine/build/source-engine/runtime/jre/lib:$GITHUB_WORKSPACE/src-tauri/plugins/source-engine/engine/build/source-engine/runtime/jre/lib/jli${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Package release installers
        run: npm run tauri -- build --no-sign --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: Foliver-${{ runner.os }}
          path: ${{ matrix.installers }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 signed release APK
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read toolchain versions
        run: node src-tauri/toolchain.mjs --github-env
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;${{ env.ANDROID_BUILDTOOLS }} ndk;${{ env.ANDROID_NDK }} cmake;${{ env.ANDROID_CMAKE }}'
      - name: Install Android compile platform
        run: |
          sdkmanager --install "platforms;android-${{ env.ANDROID_PLATFORM }}" --channel=${{ env.ANDROID_CHANNEL }}
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK }}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK }}" >> "$GITHUB_ENV"
      - name: Build Android engine AAR and QuickJS JNI
        working-directory: src-tauri/plugins/source-engine/engine
        run: bash ./gradlew --no-daemon --console=plain stageTauriAndroidAar
      - run: npm ci
      - run: npm run tauri -- android init --ci
      - run: npm run icons
      - name: Configure native Android app
        run: node src-tauri/android/configure.mjs
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLIVER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foliver-android.p12"
          chmod 600 "$RUNNER_TEMP/foliver-android.p12"
      - name: Package signed arm64 APK
        env:
          FOLIVER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/foliver-android.p12
          FOLIVER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FOLIVER_ANDROID_KEYSTORE_PASSWORD }}
          FOLIVER_ANDROID_KEY_ALIAS: ${{ secrets.FOLIVER_ANDROID_KEY_ALIAS }}
          FOLIVER_ANDROID_KEY_PASSWORD: ${{ secrets.FOLIVER_ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --apk --ci --target aarch64
      - name: Verify signed arm64 APK
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from zipfile import ZipFile

          apks = list(Path("src-tauri/gen/android/app/build/outputs/apk").rglob("*-release.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected one arm64 release APK, found {len(apks)}")
          with ZipFile(apks[0]) as apk:
              libraries = {name for name in apk.namelist() if name.startswith("lib/") and name.endswith(".so")}
          abis = {name.split("/")[1] for name in libraries}
          if abis != {"arm64-v8a"}:
              raise SystemExit(f"Unexpected APK architectures: {sorted(abis)}")
          for library in ("libfoliver_lib.so", "liblegado_quickjs.so"):
              if f"lib/arm64-v8a/{library}" not in libraries:
                  raise SystemExit(f"Missing arm64 library: {library}")
          subprocess.run([str(Path(os.environ["ANDROID_HOME"]) / "build-tools/36.0.0/apksigner"), "verify", str(apks[0])], check=True)
          print(f"Verified signed arm64 APK: {apks[0]}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: Foliver-Android-arm64-signed-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/foliver-android.p12"

  ios:
    name: iOS unsigned release IPA
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read toolchain versions
        run: node src-tauri/toolchain.mjs --github-env
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/plugins/source-engine/toolchain.properties', 'src-tauri/plugins/source-engine/engine/*.gradle.kts', 'src-tauri/plugins/source-engine/engine/kmp-engine/build.gradle.kts', 'src-tauri/plugins/source-engine/engine/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Identify Apple toolchain
        id: apple
        run: |
          key="$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } | shasum -a 256 | cut -c1-16)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Cache device source-engine framework
        id: framework
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/plugins/source-engine/engine/kmp-engine/build/iosNativeLibs/ios_arm64
            src-tauri/plugins/source-engine/ios/Frameworks/LegadoSourceEngine.xcframework
          key: ios-device-${{ runner.arch }}-${{ steps.apple.outputs.key }}-${{ env.IPHONEOS_DEPLOYMENT_TARGET }}-${{ hashFiles('src-tauri/plugins/source-engine/toolchain.properties', 'src-tauri/plugins/source-engine/engine/*.gradle.kts', 'src-tauri/plugins/source-engine/engine/gradle.properties', 'src-tauri/plugins/source-engine/engine/gradle/**', 'src-tauri/plugins/source-engine/engine/gradlew', 'src-tauri/plugins/source-engine/engine/kmp-engine/build.gradle.kts', 'src-tauri/plugins/source-engine/engine/kmp-engine/src/**', 'src-tauri/plugins/source-engine/engine/kmp-engine/scripts/**', 'src-tauri/plugins/source-engine/engine/src/native/quickjs-ng/**', 'src-tauri/plugins/source-engine/engine/quickjs-processor/build.gradle.kts', 'src-tauri/plugins/source-engine/engine/quickjs-processor/src/**', 'src-tauri/plugins/source-engine/include/**') }}
      - name: Build device framework
        if: steps.framework.outputs.cache-hit != 'true'
        working-directory: src-tauri/plugins/source-engine/engine
        run: bash ./gradlew --no-daemon --console=plain -Plegado.iosNativeTargets=ios_arm64 :kmp-engine:linkReleaseFrameworkIosArm64
      - name: Package source-engine XCFramework
        if: steps.framework.outputs.cache-hit != 'true'
        run: |
          xcodebuild -create-xcframework -framework src-tauri/plugins/source-engine/engine/kmp-engine/build/bin/iosArm64/releaseFramework/LegadoSourceEngine.framework -output src-tauri/plugins/source-engine/ios/Frameworks/LegadoSourceEngine.xcframework
      - run: npm ci
      - run: npm run tauri -- ios init --ci
      - run: npm run icons
      - name: Package unsigned device IPA
        run: npm run tauri -- ios build --no-sign --ci
      - uses: actions/upload-artifact@v7
        with:
          name: Foliver-iOS-unsigned
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14
