name: Package Foliver

on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      ref:
        type: string
        default: ''
      updater:
        type: boolean
        default: false
      tiers:
        type: string
        default: '1'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        default: all
        options: [all, desktop, android, ios]
      tiers:
        description: 'Independent tiers: 1 mainstream, 2 compatibility, 3 Android x86'
        type: choice
        default: '1'
        options: ['1', '2', '3', '1,2', '1,3', '2,3', '1,2,3']

concurrency:
  group: package-${{ github.workflow }}-${{ inputs.ref || github.ref }}-${{ inputs.platform }}-${{ inputs.tiers }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Select targets and build frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      desktop: ${{ steps.targets.outputs.desktop }}
      android: ${{ steps.targets.outputs.android }}
      has_desktop: ${{ steps.targets.outputs.has_desktop }}
      has_android: ${{ steps.targets.outputs.has_android }}
      ios: ${{ steps.targets.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Select independent target tiers
        id: targets
        env:
          TIERS: ${{ inputs.tiers }}
          PLATFORM: ${{ inputs.platform }}
        run: python scripts/release.py matrix --tiers "$TIERS" --platform "$PLATFORM"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.platform }} ${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.has_desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.desktop) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      - name: Read toolchain versions
        run: node src-tauri/toolchain.mjs --github-env
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          architecture: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: npm ci
      - run: npm run icons
      - name: Prepare desktop engine and compact Java runtime
        if: runner.os != 'Windows'
        working-directory: src-tauri/plugins/source-engine/engine
        run: bash ./gradlew --no-daemon --console=plain prepareDesktopJvmRuntime
      - name: Prepare desktop engine and compact Java runtime
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        working-directory: src-tauri/plugins/source-engine/engine
        env:
          CMAKE_GENERATOR: Ninja
          CC: gcc
          CXX: g++
        run: .\gradlew.bat --no-daemon --console=plain prepareDesktopJvmRuntime
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        with:
          arch: arm64
      - name: Prepare ARM64 desktop engine and compact Java runtime
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        working-directory: src-tauri/plugins/source-engine/engine
        env:
          CMAKE_GENERATOR: Ninja
          CC: cl
          CXX: cl
        run: .\gradlew.bat --no-daemon --console=plain prepareDesktopJvmRuntime
      - name: Configure Linux runtime library search
        if: runner.os == 'Linux'
        run: echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/src-tauri/plugins/source-engine/engine/build/source-engine/runtime/jre/lib/server:$GITHUB_WORKSPACE/src-tauri/plugins/source-engine/engine/build/source-engine/runtime/jre/lib:$GITHUB_WORKSPACE/src-tauri/plugins/source-engine/engine/build/source-engine/runtime/jre/lib/jli${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Package release installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json ${{ !inputs.updater && '--no-sign' || '' }} --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ inputs.updater && '--config src-tauri/tauri.updater.conf.json' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: Foliver-${{ matrix.platform }}-${{ matrix.arch }}
          overwrite: true
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android (${{ matrix.abi }}) signed release APK
    needs: prepare
    if: needs.prepare.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.android) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      - name: Read toolchain versions
        run: node src-tauri/toolchain.mjs --github-env
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust }}
          cache-on-failure: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;${{ env.ANDROID_BUILDTOOLS }} ndk;${{ env.ANDROID_NDK }} cmake;${{ env.ANDROID_CMAKE }}'
      - name: Install Android compile platform
        run: |
          sdkmanager --install "platforms;android-${{ env.ANDROID_SDK_PLATFORM }}" --channel=${{ env.ANDROID_CHANNEL }}
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK }}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK }}" >> "$GITHUB_ENV"
      - name: Build Android engine AAR and QuickJS JNI
        working-directory: src-tauri/plugins/source-engine/engine
        run: bash ./gradlew --no-daemon --console=plain -Plegado.androidAbis=${{ matrix.abi }} stageTauriAndroidAar
      - run: npm ci
      - run: npm run tauri -- android init --ci
      - run: npm run icons
      - name: Configure native Android app
        run: node src-tauri/android/configure.mjs
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLIVER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foliver-android.p12"
          chmod 600 "$RUNNER_TEMP/foliver-android.p12"
      - name: Package signed APK
        env:
          FOLIVER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/foliver-android.p12
          FOLIVER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FOLIVER_ANDROID_KEYSTORE_PASSWORD }}
          FOLIVER_ANDROID_KEY_ALIAS: ${{ secrets.FOLIVER_ANDROID_KEY_ALIAS }}
          FOLIVER_ANDROID_KEY_PASSWORD: ${{ secrets.FOLIVER_ANDROID_KEY_PASSWORD }}
          RELEASE_UPDATE: ${{ inputs.updater }}
        run: |
          args=(--config src-tauri/tauri.ci.conf.json)
          if [ "$RELEASE_UPDATE" = 'true' ]; then
            # One monotonic code per release run, shared by all ABIs and retries.
            # Start above the 0.1.x codes used before CI-managed versioning.
            version_code=$((1000000 + GITHUB_RUN_NUMBER))
            printf '{"bundle":{"android":{"versionCode":%d}}}\n' "$version_code" > "$RUNNER_TEMP/foliver-android.json"
            args+=(--config "$RUNNER_TEMP/foliver-android.json")
          fi
          npm run tauri -- android build --apk --ci --target ${{ matrix.target }} "${args[@]}"
      - name: Verify signed APK
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
          RELEASE_UPDATE: ${{ inputs.updater }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import subprocess
          from zipfile import ZipFile

          apks = list(Path("src-tauri/gen/android/app/build/outputs/apk").rglob("*-release.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected one release APK, found {len(apks)}")
          with ZipFile(apks[0]) as apk:
              libraries = {name for name in apk.namelist() if name.startswith("lib/") and name.endswith(".so")}
          abis = {name.split("/")[1] for name in libraries}
          abi = os.environ["EXPECTED_ABI"]
          if abis != {abi}:
              raise SystemExit(f"Unexpected APK architectures: {sorted(abis)}")
          for library in ("libfoliver_lib.so", "liblegado_quickjs.so"):
              if f"lib/{abi}/{library}" not in libraries:
                  raise SystemExit(f"Missing {abi} library: {library}")
          tools = Path(os.environ["ANDROID_HOME"]) / "build-tools" / os.environ["ANDROID_BUILDTOOLS"]
          subprocess.run([str(tools / "apksigner"), "verify", str(apks[0])], check=True)
          badging = subprocess.check_output([str(tools / "aapt2"), "dump", "badging", str(apks[0])], text=True)
          version = re.search(r"versionName='([^']+)'", badging)
          expected = json.loads(Path("package.json").read_text())["version"]
          if not version or version[1] != expected:
              raise SystemExit(f"APK versionName must match {expected}")
          if os.environ["RELEASE_UPDATE"] == "true":
              code = re.search(r"versionCode='(\d+)'", badging)
              expected_code = 1000000 + int(os.environ["GITHUB_RUN_NUMBER"])
              if not code or int(code[1]) != expected_code:
                  raise SystemExit(f"APK versionCode must match release build {expected_code}")
          print(f"Verified signed {abi} APK: {apks[0]}")
          PY
      - name: Sign APK for app updates
        if: inputs.updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          mapfile -d '' apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' -print0)
          for apk in "${apks[@]}"; do
            npm run tauri -- signer sign --app-version "$version" "$apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Foliver-android-${{ matrix.arch }}
          overwrite: true
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*-release.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*-release.apk.sig
          if-no-files-found: error
          retention-days: 14
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/foliver-android.p12"

  ios:
    name: iOS unsigned release IPA
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      - name: Read toolchain versions
        run: node src-tauri/toolchain.mjs --github-env
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/plugins/source-engine/toolchain.properties', 'src-tauri/plugins/source-engine/engine/*.gradle.kts', 'src-tauri/plugins/source-engine/engine/kmp-engine/build.gradle.kts', 'src-tauri/plugins/source-engine/engine/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Identify Apple toolchain
        id: apple
        run: |
          key="$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } | shasum -a 256 | cut -c1-16)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Cache device source-engine framework
        id: framework
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/plugins/source-engine/engine/kmp-engine/build/iosNativeLibs/ios_arm64
            src-tauri/plugins/source-engine/ios/Frameworks/LegadoSourceEngine.xcframework
          key: ios-device-${{ runner.arch }}-${{ steps.apple.outputs.key }}-${{ env.IPHONEOS_DEPLOYMENT_TARGET }}-${{ hashFiles('src-tauri/plugins/source-engine/toolchain.properties', 'src-tauri/plugins/source-engine/engine/*.gradle.kts', 'src-tauri/plugins/source-engine/engine/gradle.properties', 'src-tauri/plugins/source-engine/engine/gradle/**', 'src-tauri/plugins/source-engine/engine/gradlew', 'src-tauri/plugins/source-engine/engine/kmp-engine/build.gradle.kts', 'src-tauri/plugins/source-engine/engine/kmp-engine/src/**', 'src-tauri/plugins/source-engine/engine/kmp-engine/scripts/**', 'src-tauri/plugins/source-engine/engine/src/native/quickjs-ng/**', 'src-tauri/plugins/source-engine/engine/quickjs-processor/build.gradle.kts', 'src-tauri/plugins/source-engine/engine/quickjs-processor/src/**', 'src-tauri/plugins/source-engine/include/**') }}
      - name: Build device framework
        if: steps.framework.outputs.cache-hit != 'true'
        working-directory: src-tauri/plugins/source-engine/engine
        run: bash ./gradlew --no-daemon --console=plain -Plegado.iosNativeTargets=ios_arm64 :kmp-engine:linkReleaseFrameworkIosArm64
      - name: Package source-engine XCFramework
        if: steps.framework.outputs.cache-hit != 'true'
        run: |
          xcodebuild -create-xcframework -framework src-tauri/plugins/source-engine/engine/kmp-engine/build/bin/iosArm64/releaseFramework/LegadoSourceEngine.framework -output src-tauri/plugins/source-engine/ios/Frameworks/LegadoSourceEngine.xcframework
      - run: npm ci
      - run: npm run tauri -- ios init --ci
      - run: npm run icons
      - name: Package unsigned device IPA
        run: npm run tauri -- ios build --no-sign --ci --config src-tauri/tauri.ci.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: Foliver-ios-arm64-unsigned
          overwrite: true
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14
