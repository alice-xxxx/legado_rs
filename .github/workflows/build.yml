name: Build all platforms

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect application changes
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.filter.outputs.application }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            application:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.npmrc'
              - '.nvmrc'
              - 'src/**'
              - 'src-tauri/**'
              - 'kotlin/**'
              - 'scripts/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'index.html'
              - 'vite.config.*'
              - 'tsconfig*.json'
      - name: Explain skipped platform builds
        if: steps.filter.outputs.application != 'true' && github.event_name != 'workflow_dispatch'
        run: echo 'No application build inputs changed; platform build jobs are intentionally skipped.' >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.application == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: macos-latest
            installer_paths: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            installer_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Keep the CI cache on GitHub's open-source cache service.
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Build KMP JVM and QuickJS from repository sources
        if: runner.os != 'Windows'
        working-directory: kotlin
        run: ./gradlew --no-daemon --console=plain prepareDesktopJvmRuntime
      - name: Build KMP JVM and QuickJS from repository sources
        if: runner.os == 'Windows'
        working-directory: kotlin
        # Windows' inherited CMake generator may select NMake outside a VS developer shell.
        # Pin the available Ninja + GCC toolchain so QuickJS configures consistently in CI.
        env:
          CMAKE_GENERATOR: Ninja
          CC: gcc
          CXX: g++
        run: .\gradlew.bat --no-daemon --console=plain prepareDesktopJvmRuntime
      # linuxdeploy inspects bundled JNI libraries and needs the JRE's nested shared-library paths.
      - name: Add bundled JVM libraries to the Linux linker search path
        if: runner.os == 'Linux'
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/kotlin/build/source-engine/runtime/jre/lib/server:$GITHUB_WORKSPACE/kotlin/build/source-engine/runtime/jre/lib:$GITHUB_WORKSPACE/kotlin/build/source-engine/runtime/jre/lib/jli${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Build unsigned desktop installers
        # Preserve linuxdeploy's detailed failure output in CI instead of only the generic exit error.
        run: npm run tauri -- build --no-sign --verbose
      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installers-${{ matrix.os }}
          path: ${{ matrix.installer_paths }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK and AAR
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.application == 'true')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.14904198 cmake;3.31.1'
      - name: Install Android API 37 preview platform
        run: sdkmanager --install 'platforms;android-37.0' --channel=3
      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build KMP Android AAR and native libraries
        working-directory: kotlin
        run: ./gradlew --no-daemon --console=plain stageTauriAndroidAar
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate Android project
        run: npm run tauri -- android init --ci
      - name: Configure Android resource packaging
        env:
          LEGADO_ANDROID_STRIP_DEBUG_SYMBOLS: '1'
        run: node scripts/configure-tauri-android.mjs
      # The debug variant uses Gradle's default debug key so testers can install it without a release key.
      - name: Build test APKs
        run: npm run tauri -- android build --debug --apk --ci
      - name: Report APK and native ABI payload
        shell: bash
        run: |
          output_dir=src-tauri/gen/android/app/build/outputs/apk
          mapfile -d '' apks < <(find "$output_dir" -type f -name '*.apk' -print0)
          if (( ${#apks[@]} == 0 )); then
            echo "No APKs were produced under $output_dir" >&2
            exit 1
          fi
          declare -A packaged_libraries
          for apk in "${apks[@]}"; do
            echo "APK $(basename "$apk"): $(stat -c '%s' "$apk") bytes"
            unzip -l "$apk" | awk '$4 ~ /^lib\/[^/]+\/[^/]+\.so$/ { printf "  %10s %s\n", $1, $4 }'
            while IFS= read -r entry; do
              if [[ "$entry" =~ ^lib/([^/]+)/([^/]+\.so)$ ]]; then
                packaged_libraries["${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"]=1
              fi
            done < <(unzip -Z1 "$apk")
          done
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for library in liblegado_lib.so liblegado_quickjs.so; do
              if [[ -z "${packaged_libraries["$abi/$library"]+present}" ]]; then
                echo "Missing lib/$abi/$library from all produced APKs" >&2
                exit 1
              fi
            done
          done
          echo "All four Android ABIs contain the Rust app and QuickJS libraries."
      - name: Upload Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned IPA and frameworks
    runs-on: macos-latest
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.application == 'true')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Rust Apple targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # Kotlin/Native keeps its compiler and platform dependencies outside Gradle User Home.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kotlin/build.gradle.kts', 'kotlin/kmp-engine/build.gradle.kts', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Build device and simulator frameworks
        working-directory: kotlin
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        run: ./gradlew --no-daemon --console=plain :kmp-engine:linkReleaseFrameworkIosArm64 :kmp-engine:linkReleaseFrameworkIosSimulatorArm64
      - name: Package Kotlin/Native framework for the iOS Tauri plugin
        run: |
          mkdir -p src-tauri/plugins/source-engine/ios/Frameworks
          xcodebuild -create-xcframework \
            -framework kotlin/kmp-engine/build/bin/iosArm64/releaseFramework/LegadoSourceEngine.framework \
            -framework kotlin/kmp-engine/build/bin/iosSimulatorArm64/releaseFramework/LegadoSourceEngine.framework \
            -output src-tauri/plugins/source-engine/ios/Frameworks/LegadoSourceEngine.xcframework
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate iOS project
        run: npm run tauri -- ios init --ci
      # Deliberately omit Apple signing credentials; the IPA must be re-signed before device installation.
      - name: Build unsigned test IPA
        run: npm run tauri -- ios build --no-sign --ci
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14
