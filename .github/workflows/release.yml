name: Release Foliver
run-name: Release from ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'Keep the completed release as a draft'
        type: boolean
        default: false
      tiers:
        description: 'Independent tiers: 1 mainstream, 2 compatibility, 3 Android x86'
        type: choice
        default: '1'
        options: ['1', '2', '3', '1,2', '1,3', '2,3', '1,2,3']

concurrency:
  group: release-foliver
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tiers: ${{ steps.targets.outputs.tiers }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read app version and validate source
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python scripts/release.py check "$RELEASE_TAG"
      - name: Check release state
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').validate({ github, context });
      - name: Validate selected target tiers
        id: targets
        env:
          TIERS: ${{ inputs.tiers || '1' }}
        run: |
          python scripts/release.py matrix --tiers "$TIERS"
          echo "tiers=$TIERS" >> "$GITHUB_OUTPUT"
      - name: Check signing configuration
        env:
          FOLIVER_ANDROID_KEYSTORE_BASE64: ${{ secrets.FOLIVER_ANDROID_KEYSTORE_BASE64 }}
          FOLIVER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FOLIVER_ANDROID_KEYSTORE_PASSWORD }}
          FOLIVER_ANDROID_KEY_ALIAS: ${{ secrets.FOLIVER_ANDROID_KEY_ALIAS }}
          FOLIVER_ANDROID_KEY_PASSWORD: ${{ secrets.FOLIVER_ANDROID_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in FOLIVER_ANDROID_KEYSTORE_BASE64 FOLIVER_ANDROID_KEYSTORE_PASSWORD FOLIVER_ANDROID_KEY_ALIAS FOLIVER_ANDROID_KEY_PASSWORD TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

  checks:
    name: Check source
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  build:
    name: Build release
    needs: [prepare, checks]
    uses: ./.github/workflows/build.yml
    with:
      platform: all
      ref: ${{ needs.prepare.outputs.commit }}
      updater: true
      tiers: ${{ needs.prepare.outputs.tiers }}
    secrets: inherit

  publish:
    name: Verify and publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      RELEASE_DRAFT: ${{ inputs.draft || false }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TIERS: ${{ needs.prepare.outputs.tiers }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: Foliver-*
          path: artifacts
      - name: Validate all packages and generate update manifest
        run: python scripts/release.py collect "$RELEASE_TAG" --tiers "$RELEASE_TIERS"
      - name: Create release tag and stage draft
        id: draft
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/release.cjs').stage({ github, context, core });
      - name: Add release notes to update manifest
        run: python scripts/release.py finalize "$RUNNER_TEMP/foliver-release-notes.json"
      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Verify uploaded assets and publish
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').publish({ github, context, core });
