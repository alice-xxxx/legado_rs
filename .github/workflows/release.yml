name: Release Foliver
run-name: Release from ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'Keep the completed release as a draft'
        type: boolean
        default: false

concurrency:
  group: release-foliver
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read app version and validate source
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python scripts/release.py check "$RELEASE_TAG"
      - name: Check release state
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').validate({ github, context });
      - name: Check signing configuration
        env:
          FOLIVER_ANDROID_KEYSTORE_BASE64: ${{ secrets.FOLIVER_ANDROID_KEYSTORE_BASE64 }}
          FOLIVER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FOLIVER_ANDROID_KEYSTORE_PASSWORD }}
          FOLIVER_ANDROID_KEY_ALIAS: ${{ secrets.FOLIVER_ANDROID_KEY_ALIAS }}
          FOLIVER_ANDROID_KEY_PASSWORD: ${{ secrets.FOLIVER_ANDROID_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in FOLIVER_ANDROID_KEYSTORE_BASE64 FOLIVER_ANDROID_KEYSTORE_PASSWORD FOLIVER_ANDROID_KEY_ALIAS FOLIVER_ANDROID_KEY_PASSWORD TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

  checks:
    name: Check source
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release
    needs: [prepare, checks]
    uses: ./.github/workflows/build.yml
    with:
      platform: all
      ref: ${{ needs.prepare.outputs.commit }}
      updater: true
    secrets: inherit

  publish:
    name: Verify and publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      RELEASE_DRAFT: ${{ inputs.draft || false }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: Foliver-*
          path: artifacts
      - name: Validate all packages and generate update manifest
        run: python scripts/release.py collect "$RELEASE_TAG" "$RELEASE_COMMIT"
      - name: Create release tag and stage draft
        id: draft
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/release.cjs').stage({ github, context, core });
      - name: Add release notes and finalize checksums
        run: python scripts/release.py finalize "$RUNNER_TEMP/foliver-release-notes.json"
      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Verify uploaded assets and publish
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').publish({ github, context, core });

  result:
    name: Release result
    if: always()
    needs: [prepare, checks, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          if failed:
              raise SystemExit(f"Release incomplete: {', '.join(failed)}. Check the first failed job; incomplete packages are never published.")
          print('Release complete.')
          PY
